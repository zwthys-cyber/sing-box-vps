name: Serv00 Keepalive Ping

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/30 * * * *'

jobs:
  fetch-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ping keepalive URLs
        run: |
          IFS=$',， ' read -r -a http <<< "${{ secrets.http }}"
          echo "*****************************************************"
          echo "Project: github.com/zwthys-cyber/sing-box-vps"
          echo "Serv00 keepalive runner"
          echo "*****************************************************"
          if [[ ${#http[@]} -eq 0 || -z "${http[0]}" ]]; then
            echo "No secrets.http configured; skip."
            exit 0
          fi
          for url in "${http[@]}"; do
            response=$(curl -sk "$url" || true)
            if [[ "$response" == *"网页保活启动"* ]]; then
              echo "OK keepalive: $url"
            elif [[ "$response" == *"主程序重启成功"* ]]; then
              echo "OK restart: $url"
            else
              echo "FAIL: $url"
            fi
          done
